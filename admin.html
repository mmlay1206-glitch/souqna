<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوقنا | لوحة الإدارة والنشر</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Cairo) -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- شاشة التحميل/التحقق من الدخول -->
  <div id="loading" class="flex flex-col items-center justify-center min-h-screen">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
    <p class="mt-4 text-gray-600">جاري التحقق من صلاحيات الدخول...</p>
  </div>

  <!-- محتوى لوحة التحكم (مخفي افتراضياً لحين التأكد من تسجيل الدخول) -->
  <div id="admin-content" class="hidden container mx-auto p-4 max-w-2xl">
    <!-- الشريط العلوي -->
    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow mb-6">
      <div>
        <h1 class="text-xl font-bold text-gray-800">لوحة تحكم التاجر</h1>
        <p id="user-email" class="text-sm text-gray-500"></p>
      </div>
      <button id="logout-btn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm transition">
        تسجيل الخروج
      </button>
    </div>

    <!-- نموذج إضافة منتج جديد -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-lg font-bold mb-4 text-gray-700">إضافة منتج جديد</h2>
      <form id="add-product-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">اسم المنتج</label>
          <input type="text" id="prod-name" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">السعر (ل.س)</label>
          <input type="number" id="prod-price" required class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">رابط الصورة</label>
          <input type="url" id="prod-image" placeholder="https://..." class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">الوصف</label>
          <textarea id="prod-desc" rows="3" class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg transition">
          نشر المنتج
        </button>
      </form>
    </div>
  </div>

  <script>
    // ⚠️ استبدل إعدادات Firebase أدناه ببيانات مشروعك الخاصة من Firebase Console
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // تهيئة Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // 🔒 التحقق الأمني الفوري من تسجيل الدخول
    auth.onAuthStateChanged((user) => {
      const loadingEl = document.getElementById('loading');
      const contentEl = document.getElementById('admin-content');

      if (user) {
        // المستخدم مسجل دخوله بنجاح -> أظهر اللوحة
        loadingEl.classList.add('hidden');
        contentEl.classList.remove('hidden');
        document.getElementById('user-email').innerText = user.email;
      } else {
        // المستخدم غير مسجل -> توجيه فوراً لصفحة الدخول أو التنبيه
        alert("عفواً! لا يُمكِنك الوصول لهذه الصفحة بدون تسجيل الدخول.");
        window.location.href = "index.html"; // أو login.html إذا كانت لديك صفحة دخول مستقلة
      }
    });

    // زر تسجيل الخروج
    document.getElementById('logout-btn').addEventListener('click', () => {
      auth.signOut().then(() => {
        window.location.href = "index.html";
      });
    });

    // نموذج إضافة المنتج
    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const user = auth.currentUser;
      if (!user) {
        alert("غير مسموح بالنشر بدون تسجيل الدخول!");
        return;
      }

      const name = document.getElementById('prod-name').value;
      const price = document.getElementById('prod-price').value;
      const image = document.getElementById('prod-image').value;
      const desc = document.getElementById('prod-desc').value;

      try {
        await db.collection('products').add({
          name: name,
          price: Number(price),
          image: image || 'https://via.placeholder.com/150',
          description: desc,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          userId: user.uid
        });

        alert("تم نشر المنتج بنجاح!");
        document.getElementById('add-product-form').reset();
      } catch (error) {
        console.error("خطأ في النشر:", error);
        alert("حدث خطأ أثناء إضافة المنتج: " + error.message);
      }
    });
  </script>
</body>
</html>
